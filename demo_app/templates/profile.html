{% extends "base.html" %}
{% block title %}Profile · HarborDesk{% endblock %}
{% block content %}
<h1 data-testid="profile-heading">Profile</h1>
{% if errors.form %}
<p class="error" data-testid="error-form">{{ errors.form }}</p>
{% endif %}
<form method="post" action="/profile" data-testid="profile-form" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" value="{{ name_value }}" data-testid="profile-name">
  {% if errors.name %}<p class="error" data-testid="error-name">{{ errors.name }}</p>{% endif %}
  <label for="email">Email</label>
  <input id="email" type="email" value="{{ user.email }}" disabled data-testid="profile-email">
  <button type="submit" data-testid="save-profile">Save profile</button>
</form>
{% endblock %}
